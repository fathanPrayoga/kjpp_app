</head>
<body>

    <header class="navbar">
        <div class="logo-container">
           <img src="/css/kjpp_logo.png" alt="Logo Perusahaan" class="navbar-logo">
        </div>
        <nav class="nav-links">
            <a href="verifikasi_properti.html">Properti</a>
            <a href="#">Laporan</a>
            <a href="#" class="active">Obrolan</a>
            <a href="#">Setting</a>
        </nav>
        <div class="user-profile">
            <img src="/css/mbak yui.jpg" alt="Foto Profil" class="profile-pic">
        </div>
    </header>
    
    <div class="chat-container">
        
        <div class="left-panel">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Pencarian">
            </div>
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="unread">Unread</button>
                <button class="filter-btn" data-filter="important">Important</button>
            </div>
            
            <div class="user-list" id="userList">
                </div>
        </div>

        <div class="right-panel">
            <div class="chat-header">
                <div class="profile-pic">
                    <img src="" alt="Profil Pengguna">
                </div>
                <div class="user-name">Memuat...</div>
            </div>

            <div class="chat-messages" id="chatMessages">
                </div>

            <div class="chat-input">
                <textarea id="messageInput" placeholder="type here.."></textarea>
                <button id="sendMessageBtn" title="Kirim Pesan">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="../scripts/chat.js"></script>
</body>
