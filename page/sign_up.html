<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru (Sign Up)</title>
    <link rel="stylesheet" href="../css/login.css"> 
    <link rel="stylesheet" href="../css/sign_up.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        
        <div class="form-wrapper sign-up-form">
            
            <div class="top-section">
                <div class="header-text">
                    <h1>Sign Up</h1>
                    <p>Lets join with us!</p>
                </div>
                <div class="illustration">
                    <img src="/css/kjpp_logo.png" alt="logo" class="signup-logo">
                </div>
            </div>

            <div class="form-box sign-up-box">
                <form>
                    <div class="input-group">
                        <i class="fas fa-envelope icon"></i>
                        <input type="email" placeholder="Enter your email address">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-user icon"></i>
                        <input type="text" placeholder="Enter your username">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" placeholder="Enter your password">
                        <i class="fas fa-eye-slash toggle-password"></i>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" placeholder="Confirm your password">
                        <i class="fas fa-eye-slash toggle-password"></i>
                    </div>
                    
                    <button type="submit" class="btn sign-up-btn">Sign Up</button>
                    
                    <p class="social-text">Or log in using</p>
                    <div class="social-login">
                        <i class="fab fa-google google-icon"></i>
                    </div>
                    
                    <p class="link-text">Already have an account? <a href="login.html" class="log-in-link">Log in</a></p>
                </form>
            </div>
        </div>
        
    </div>
</body>
</html>
