<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Dashboard</title>
  <link rel="stylesheet" href="../css/laporan.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>

<body>

  <!-- Navigasi -->
  <header class="navbar">
    <div class="logo-container">
      <img src="../css/kjpp_logo.png" alt="Logo Perusahaan" class="navbar-logo">
    </div>
    <nav class="nav-links">
      <a href="#">Properti</a>
      <a href="../page/dashboard_laporan_karyawan.html">Laporan</a>
      <a href="#">Obrolan</a>
      <a href="#">Setting</a>
    </nav>
    <div class="user-profile">
      <img src="../css/mbak yui.jpg" alt="Foto Profil" class="profile-pic">
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="main-content">
    <h1>Laporan</h1>
    <div class="laporan-container">

      <!-- Menu Kiri -->
      <div class="laporan-menu">

        <!-- Card Project -->
        <div class="laporan-card" onclick="window.location.href='laporan_project.html'">
          <div class="icon-box">
            <img src="../css/box.png" alt="">
          </div>
          <div class="laporan-text">
            <h3>Project</h3>
            <p>Laporan</p>
          </div>
        </div>

        <!-- Card Tahunan (Active) -->
        <div class="laporan-card active" onclick="window.location.href='laporan_tahunan.html'">
          <div class="calendar-days">
            <img src="../css/calendar-days.png" alt="">
          </div>
          <div class="laporan-text">
            <h3>Tahunan</h3>
            <p>Laporan</p>
          </div>
        </div>
      </div>

      <!-- Area kanan -->
      <div class="laporan-display">
        <h3>Laporan Anda</h3>
        <div class="laporan-box" id="laporanBox">
          <p class="placeholder">Laporan belum ada</p>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
