<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klien-Properti Dokumen</title>
    <link rel="stylesheet" href="/css/verifikasi_properti.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
           <img src="/css/kjpp_logo.png" alt="Logo Perusahaan" class="navbar-logo">
        </div>
        <nav class="nav-links">
            <a href="#" class="active">Properti</a>
            <a href="#">Laporan</a>
            <a href="#">Obrolan</a>
            <a href="#">Setting</a>
        </nav>
        <div class="user-profile">
            <img src="/css/mbak yui.jpg" alt="Foto Profil" class="profile-pic">
        </div>
    </header>

    <main class="content-container">
        
        <h1 class="page-title">Properti</h1>

        <div class="page-layout">
            
            <div class="category-menu">
                
                <div class="category-card active-category">
                    <div class="category-icon green-bg"><i class="fas fa-file-alt"></i></div>
                    <div class="category-text">
                        <h3>Dokumen</h3>
                        <p>Properti</p>
                    </div>
                </div>

                <div class="category-card">
                    <div class="category-icon green-bg"><i class="fas fa-hard-hat"></i></div>
                    <div class="category-text">
                        <h3>Fisik</h3>
                        <p>Properti</p>
                    </div>
                </div>
                
                <div class="category-card">
                    <div class="category-icon green-bg"><i class="fas fa-pencil-alt"></i></div>
                    <div class="category-text">
                        <h3>Penilaian</h3>
                        <p>Properti</p>
                    </div>
                </div>

            </div>

            <div class="document-detail-panel">
                <h2 class="detail-title">Dokumen</h2>

                <div class="document-item">
                    <div class="doc-info">
                        <span class="doc-name">Asri</span>
                        <span class="doc-project">Project Asri</span>
                    </div>
                    <span class="verification-badge verified">Terverifikasi</span>
                </div>
                
                </div>
        </div>

    </main>

</body>
</html>
